<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>3D Universe</title>
    <style>
      :root {
        color-scheme: dark;
        --void: #05060a;
        --ink: #8a8f98;
        --ink-dim: #7c828d;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: var(--void); overflow: hidden; }
      #view { display: block; width: 100vw; height: 100vh; }

      #hud {
        position: fixed;
        inset: 0;
        pointer-events: none;
        font: 11px/1.7 ui-monospace, SFMono-Regular, Menlo, monospace;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--ink);
      }
      /* Vignette lives in display space, not the scene: it darkens the corners
         of the frame without touching a single star's colour. */
      #vignette {
        position: fixed;
        inset: 0;
        pointer-events: none;
        background: radial-gradient(ellipse at center,
          rgba(5, 6, 10, 0) 45%,
          rgba(5, 6, 10, 0.35) 78%,
          rgba(5, 6, 10, 0.75) 100%);
      }

      #title-lockup { position: absolute; top: 14px; left: 16px; }
      #title-lockup .mark { display: inline-block; width: 9px; height: 9px; margin-right: 8px;
        border: 1px solid var(--ink); transform: rotate(45deg); }
      #title-lockup .name { font-size: 12px; letter-spacing: 0.28em; color: #c6cad2; }
      #title-lockup .sub { display: block; margin-top: 3px; color: var(--ink-dim); letter-spacing: 0.18em; }

      #nav { position: absolute; top: 15px; left: 50%; transform: translateX(-50%);
        max-width: 52vw; overflow: hidden; color: var(--ink-dim); white-space: pre; }

      #factcard { position: absolute; bottom: 18px; left: 16px; width: 268px; padding: 10px 12px;
        border: 1px solid rgba(138, 143, 152, 0.22); background: rgba(5, 6, 10, 0.55); }
      #factcard[hidden] { display: none; }
      #factcard .name { color: #c6cad2; letter-spacing: 0.2em; }
      #factcard .rows { margin: 7px 0; white-space: pre; color: var(--ink); letter-spacing: 0.08em; }
      #factcard .provenance { color: var(--ink-dim); letter-spacing: 0.1em; font-size: 10px; }
      #factcard img { width: 96px; height: 96px; object-fit: cover; float: right; margin: 0 0 6px 8px; }

      #readout { position: absolute; bottom: 18px; left: 50%; transform: translateX(-50%);
        display: flex; gap: 10px; }
      #readout div { padding: 6px 11px; border: 1px solid rgba(138, 143, 152, 0.22);
        background: rgba(5, 6, 10, 0.55); }
      #readout .label { display: block; color: var(--ink-dim); font-size: 9px; letter-spacing: 0.2em; }
      #readout .value { color: #c6cad2; font-size: 12px; letter-spacing: 0.12em; }
      /* The HUD ignores the pointer so drags reach the sky, but the three
         things a viewer can operate must take it back. Without this the search
         box and the epoch slider look live and are not: clicks land on the
         canvas behind them. */
      #search, #export, #epoch { pointer-events: auto; }

      /* Cinematic: the chrome gets out of the way without disappearing, so a
         viewer can still read the badge and knows how to take the sky back. */
      body.cinematic #readout, body.cinematic #hint, body.cinematic #epoch-line,
      body.cinematic #epoch, body.cinematic #export { opacity: 0.18; }
      body.cinematic #badge { opacity: 0.6; }
      body.cinematic { cursor: none; }

      #export { position: absolute; bottom: 18px; left: 16px; padding: 6px 11px;
        background: rgba(5, 6, 10, 0.55); border: 1px solid rgba(138, 143, 152, 0.22);
        color: var(--ink-dim); font: inherit; font-size: 9px; letter-spacing: 0.2em;
        text-transform: uppercase; cursor: pointer; }
      #export:hover { color: #c6cad2; border-color: rgba(198, 202, 210, 0.5); }

      /* The caption belongs to the hold. It is the only thing the cinematic adds
         to the frame, and it leaves with everything else when the sky does. */
      #caption { position: absolute; bottom: 96px; left: 50%; transform: translateX(-50%);
        max-width: 620px; padding: 9px 14px; text-align: center;
        border: 1px solid rgba(138, 143, 152, 0.18); background: rgba(5, 6, 10, 0.6);
        color: #c6cad2; font-size: 11px; letter-spacing: 0.06em; text-transform: none;
        line-height: 1.6; }
      #caption[hidden] { display: none; }

      #badge { position: absolute; bottom: 18px; right: 16px; padding: 6px 11px;
        border: 1px solid rgba(138, 143, 152, 0.3); color: #c6cad2; letter-spacing: 0.22em; }
      #hud-meta { position: absolute; top: 14px; right: 16px; color: var(--ink-dim); text-align: right; }
      /* One field, no chrome: search has to be reachable without a tutorial. */
      #search { position: absolute; top: 42px; right: 16px; width: 190px; padding: 5px 8px;
        background: rgba(5, 6, 10, 0.5); border: 1px solid rgba(138, 143, 152, 0.22); color: #c6cad2;
        font: inherit; letter-spacing: 0.14em; text-transform: uppercase; }
      #search:focus { outline: 1px solid rgba(198, 202, 210, 0.7); border-color: rgba(138, 143, 152, 0.55); }
      :focus-visible { outline: 1px solid rgba(198, 202, 210, 0.8); outline-offset: 2px; }
      #search::placeholder { color: var(--ink-dim); }
      #search-result { position: absolute; top: 74px; right: 16px; color: var(--ink-dim); }
      #epoch { position: absolute; bottom: 18px; left: 50%; transform: translateX(-50%);
        display: none; }
      #epoch-line { position: absolute; bottom: 74px; left: 50%; transform: translateX(-50%);
        color: var(--ink-dim); white-space: pre; }
      #hint { position: absolute; bottom: 46px; left: 50%; transform: translateX(-50%);
        color: var(--ink-dim); letter-spacing: 0.2em; white-space: nowrap; }
      #hint:empty { display: none; }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <div id="vignette"></div>

    <div id="hud">
      <div id="title-lockup">
        <span class="mark" aria-hidden="true"></span><span class="name" data-hud="title">3D UNIVERSE</span>
        <span class="sub" data-hud="subtitle">a provenance-honest atlas</span>
      </div>
      <div id="nav" data-hud="nav">ATLAS · ROUTE · TIERS · PROVENANCE</div>
      <div id="hud-meta"><span data-hud="waypoint">free flight</span></div>
      <input id="search" type="search" placeholder="search  (name or HIP)" autocomplete="off" spellcheck="false" />
      <div id="search-result"></div>

      <div id="factcard" data-hud="factcard" hidden>
        <img data-fact="image" alt="" hidden />
        <div class="name" data-fact="name"></div>
        <div class="rows" data-fact="rows"></div>
        <div class="provenance" data-fact="provenance"></div>
      </div>

      <div id="readout">
        <div><span class="label">objects in view</span><span class="value" data-hud="objects">0</span></div>
        <div><span class="label">distance range</span><span class="value" data-hud="distance">—</span></div>
        <div><span class="label">data source</span><span class="value" data-hud="source">none</span></div>
      </div>
      <button id="export" data-hud="export" type="button">download this slice as csv</button>


      <div id="caption" hidden></div>
      <div id="hint"></div>
      <div id="epoch-line">sky epoch —</div>
      <input id="epoch" type="range" min="-10000" max="10000" step="10" value="0"
             aria-label="observer epoch, years from now" />
      <div id="badge" data-hud="badge">EMPTY</div>
    </div>

    <script type="importmap">
      {
        "imports": {
          "three": "../node_modules/three/build/three.webgpu.js",
          "three/webgpu": "../node_modules/three/build/three.webgpu.js",
          "three/tsl": "../node_modules/three/build/three.tsl.js",
          "three/addons/": "../node_modules/three/examples/jsm/"
        }
      }
    </script>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
